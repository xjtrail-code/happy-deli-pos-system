<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | Happy Deli Junco</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="login-page">
  <section class="form-card login-card">
    <h1 class="h3">Reset password</h1>
    {% if invalid %}
    <p role="alert">This reset link is invalid or expired. Please request a new one.</p>
    <a href="{{ url_for('forgot_password') }}">Request a new link</a>
    {% else %}
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label" for="password">New password</label>
      <input class="form-control mb-3" id="password" name="password" type="password" minlength="12" autocomplete="new-password" required>
      <p>At least 12 characters.</p>
      <label class="form-label" for="confirm-password">Confirm password</label>
      <input class="form-control mb-3" id="confirm-password" name="confirm_password" type="password" minlength="12" autocomplete="new-password" required>
      <button class="btn btn-primary" type="submit">Save new password</button>
    </form>
    {% endif %}
    <p class="mt-3"><a href="{{ url_for('home') }}">Back to sign in</a></p>
  </section>
</main>
</body>
</html>
