<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Happy Deli Junco</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body class="login-body">

    <main class="login-page">

        <!-- Decorative background -->
        <div class="login-decoration login-decoration-top"></div>
        <div class="login-decoration login-decoration-bottom"></div>

        <!-- Login card only -->
        <div class="form-card login-card">

            <div class="login-brand">
                <i class="bi bi-shop login-store-icon"></i>

                <h1>Happy Deli Junco</h1>
                <p>Employee Login</p>
            </div>

            <hr class="login-divider">

            <!-- Flash messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show">
                        {{ message }}

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert"
                            aria-label="Close"
                        ></button>
                    </div>
                {% endfor %}
            {% endwith %}

            {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('home') }}">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <!-- Username -->
                <div class="login-field">
                    <label for="username" class="form-label">
                        User
                    </label>

                    <div class="login-input-wrapper">
                        <i class="bi bi-person-fill login-input-icon"></i>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control login-input"
                            placeholder="Enter username"
                            autocomplete="username"
                            required
                        >

                    </div>
                </div>

                <!-- Password -->
                <div class="login-field">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <div class="login-input-wrapper">
                        <i class="bi bi-lock-fill login-input-icon"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control login-input password-input"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <i class="bi bi-eye-fill"></i>
                        </button>
                    </div>

                </div>
                <div>    
                    <a href="{{ url_for('forgot_password') }}" style="color: var(--primary); font-weight: 700;">Forgot Password?</a>
                </div>
                <!-- Login button -->
                <button type="submit" class="btn login-button">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Login
                </button>

            </form>
        </div>

        <!-- Decorative icons -->
        <div class="login-bottom-icons" aria-hidden="true">
            <i class="bi bi-cart3"></i>
            <i class="bi bi-shop"></i>
        </div>

    </main>

    <script>
        const password = document.getElementById("password");
        const toggle = document.getElementById("togglePassword");

        toggle.addEventListener("click", function () {
            const isHidden = password.type === "password";

            password.type = isHidden ? "text" : "password";

            this.innerHTML = isHidden
                ? '<i class="bi bi-eye-slash-fill"></i>'
                : '<i class="bi bi-eye-fill"></i>';

            this.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );

            this.setAttribute("aria-pressed", String(isHidden));
        });
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
